name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows, so the PowerShell status line tests run instead of being skipped.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # The tests never start Electron; skip its large binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # The landing page is its own npm project; Verify builds and tests it too.
      - run: npm ci --prefix site
      - run: npm run verify
