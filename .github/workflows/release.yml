name: Release

# A pushed version tag (vMAJOR.MINOR.PATCH, or a pre-release such as
# v0.1.0-rc.1) builds both Windows packages and attaches them to a draft
# GitHub Release. The maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ['v*.*.*']

# Only this workflow may write releases; Verify stays read-only.
permissions:
  contents: write

# No concurrency group: a release run is never cancelled by a newer push.

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # electron-builder downloads its own Electron; the tests never start it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      # The landing page is its own npm project; Verify builds and tests it too.
      - run: npm ci --prefix site
      - run: npm run verify

      # Before the build, so a tag that does not match package.json, or a
      # missing CHANGELOG.md section, stops the release in seconds.
      - name: Release notes
        shell: bash
        run: node scripts/release-notes.js "$TAG" > notes.md

      # Build only. electron-builder's own publishing uploads each target in
      # parallel and, since a draft cannot be found by its tag, made one draft
      # per target in the first test run. One `gh release create` below avoids that.
      - name: Build
        shell: bash
        run: npm run dist

      # A stable asset name lets the landing page download without an API lookup.
      # Keep the versioned installer for electron-updater and release selection.
      - name: Direct download alias
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath "dist/Token-Huddle-Setup-$version.exe" -Destination dist/Token-Huddle-Setup.exe

      - name: Checksums
        shell: pwsh
        run: |
          # LF line endings and no BOM, so `sha256sum -c` accepts the file too.
          $lines = Get-ChildItem dist -Filter *.exe |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      # One call creates the draft with every file, the notes and the
      # pre-release flag, so there is exactly one release per tag.
      - name: Draft release
        shell: bash
        env:
          # Actions' own per-run token, only in the step that writes the release.
          # It never reaches npm install scripts, the app or the repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "${TAG#v}" --notes-file notes.md "${flags[@]}" \
            dist/*.exe dist/*.blockmap dist/latest.yml dist/SHA256SUMS.txt
